name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          notes=$(git log --no-merges --format='- %s' "$range" | grep -v '^- Bump version' || true)
          if [ -n "$prev" ]; then
            notes="$notes"$'\n\n'"**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
          fi

          gh release create "$TAG" --title "$TAG" --latest --notes "$notes"
