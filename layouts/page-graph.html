<section class="page-graph">
<h2>Graph</h2>
<div class="page-graph-container" id="page-graph"></div>
</section>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  const data = {graph_json};
  const centerId = {center_id};
  const container = document.getElementById('page-graph');
  const width = container.clientWidth;
  const height = 220;
  container.style.height = height + 'px';

  const svg = d3.select('#page-graph')
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  const g = svg.append('g');

  const zoom = d3.zoom()
    .scaleExtent([0.5, 4])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoom);

  const nodeRadius = d => d.id === centerId ? 8 : 5;

  const simulation = d3.forceSimulation(data.nodes)
    .force('link', d3.forceLink(data.links).id(d => d.id).distance(60))
    .force('charge', d3.forceManyBody().strength(-80))
    .force('x', d3.forceX(width / 2).strength(0.15))
    .force('y', d3.forceY(height / 2).strength(0.15))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 4));

  const link = g.append('g')
    .selectAll('line')
    .data(data.links)
    .join('line')
    .attr('stroke', '#ccc')
    .attr('stroke-width', 0.8);

  const node = g.append('g')
    .selectAll('circle')
    .data(data.nodes)
    .join('circle')
    .attr('r', nodeRadius)
    .attr('fill', d => d.id === centerId ? '#03C75A' : '#b2dfdb')
    .attr('stroke', '#fff')
    .attr('stroke-width', 1.5)
    .style('cursor', 'pointer')
    .on('click', (event, d) => {
      if (d.id !== centerId) window.location.href = d.id + '.html';
    })
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('title').text(d => d.title);

  const labels = g.append('g')
    .selectAll('text')
    .data(data.nodes)
    .join('text')
    .text(d => d.title)
    .attr('font-size', d => d.id === centerId ? 12 : 10)
    .attr('font-weight', d => d.id === centerId ? '700' : '400')
    .attr('fill', '#666')
    .attr('dx', d => nodeRadius(d) + 3)
    .attr('dy', 3)
    .style('pointer-events', 'none');

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('cx', d => d.x).attr('cy', d => d.y);
    labels.attr('x', d => d.x).attr('y', d => d.y);
  });
})();
</script>
